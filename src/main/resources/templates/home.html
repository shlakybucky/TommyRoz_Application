<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TommyRoz Application</title>
    <style>
        body {
            background-color: #e6e6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #4b0082;
            margin-bottom: 20px;
        }

        .button {
            background-color: #9370db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            background-color: #7b68ee;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome to TommyRoz Account Manager</h1>
    <!--    <a th:href="@{/signup}" class="button">Sign up</a>-->
</div>
</body>
</html>
