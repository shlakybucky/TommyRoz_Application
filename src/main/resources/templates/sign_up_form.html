<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up</title>
</head>
<body>
<h2>Sign Up</h2>

<form th:action="@{/auth/signup}" th:object="${signUpRequest}" method="post">
    <div>
        <label>Login:</label>
        <input type="text" th:field="*{login}"/>
        <div th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
    </div>

    <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}"/>
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <div>
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}"/>
        <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div>
        <label>Phone:</label>
        <input type="text" th:field="*{phone}"/>
        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>

    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}"/>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <div th:if="${errorMessage}" style="color: red;">
        <p th:text="${errorMessage}"></p>
    </div>

    <button type="submit">Register</button>
</form>

<a href="/auth/login">Already registered? Login here</a>

</body>
</html>
